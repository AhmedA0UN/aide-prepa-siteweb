<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPI2 MI - TDs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="../../../filiere.html">Aide Prépa</a></div></nav>
<main class="container py-5">
  <h1>CPI2 MI — TDs</h1>
  <div id="list" class="list-group">Chargement…</div>
</main>
<script>
;(async function(){
  const params = new URL(window.location.href).searchParams;
  const year = params.get('year');
  try{
    const res = await fetch('../../../../data/contents.json');
    const all = await res.json();
    const node = (all.integre && all.integre.cpi2 && all.integre.cpi2.mi) || {};
    let items = [];
    if (year && node[year]) items = node[year].tds || [];
    else { Object.values(node).forEach(v=>{ if (v && v.tds) items = items.concat(v.tds); }); }
    const container = document.getElementById('list'); container.innerHTML = '';
    if (!items.length) return container.textContent = 'Aucun TD.';
    items.forEach(i=>{
      const a = document.createElement('a'); a.className='list-group-item list-group-item-action'; a.textContent = i.titre || i.id; if (i.fichier) a.href=`../../../../data/${i.fichier}`; container.appendChild(a);
    });
  }catch(e){ document.getElementById('list').textContent = 'Erreur de chargement.' }
})();
</script>
</body>
</html>
