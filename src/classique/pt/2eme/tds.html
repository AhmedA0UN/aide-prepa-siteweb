<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PT - TDs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="../../../filiere.html">Aide Prépa</a></div></nav>
<main class="container py-5">
  <h1>PT — TDs</h1>
  <div id="list" class="list-group">Chargement…</div>
</main>
<script>
;(async function(){
  const params = new URL(window.location.href).searchParams;
  const year = params.get('year');
  try{
    const res = await fetch('../../../data/contents.json');
    const all = await res.json();
    const node = (all.classique && all.classique.pt) || {};
    let items = [];
    if (year && node[year]) items = node[year].tds || [];
    else { Object.values(node).forEach(v=>{ if (v && v.tds) items = items.concat(v.tds); }); }
    const container = document.getElementById('list'); container.innerHTML = '';
    if (!items.length) return container.textContent = 'Aucun TD.';
    const makeCard = (it) => {
      const card = document.createElement('div'); card.className='card mb-2';
      const body = document.createElement('div'); body.className='card-body';
      const h = document.createElement('h5'); h.className='card-title'; h.textContent = it.titre || it.id;
      body.appendChild(h);
      if (it.description) { const p = document.createElement('p'); p.className='card-text'; p.textContent = it.description; body.appendChild(p); }
      if (it.fichier) { const a = document.createElement('a'); a.className='btn btn-sm btn-primary'; a.href=`../../../data/${it.fichier}`; a.textContent='Télécharger'; body.appendChild(a); }
      card.appendChild(body); return card;
    };
    items.forEach(it=> container.appendChild(makeCard(it)));
  }catch(e){ document.getElementById('list').textContent = 'Erreur de chargement.' }
})();
</script>
</body>
</html>
