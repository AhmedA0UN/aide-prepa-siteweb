<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cours</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">Aide Prépa</a>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="filiere.html">Filière</a></li>
    </ul>
    </div>
  </div>
</nav>
<main class="container py-5">
  <div id="content">
    <h1>Cours</h1>
    <p id="subtitle">Liste des cours disponibles :</p>
    <div class="list-group" id="coursList">
      <!-- cours chargés dynamiquement -->
    </div>
  </div>
  <script>
  (async function(){
    const params = new URL(window.location.href).searchParams;
    const f = params.get('f');
    if (f) {
      const subtitle = document.getElementById('subtitle');
      subtitle.textContent = `Filière: ${f.toUpperCase()}`;
      const back = document.createElement('p');
      back.innerHTML = `<a href="filiere.html?code=${encodeURIComponent(f)}" class="btn btn-sm btn-outline-secondary">← Retour</a>`;
      document.getElementById('content').insertBefore(back, document.getElementById('content').firstChild);
    }

    // Charger les cours depuis le fichier JSON
    const list = document.getElementById('coursList');
    try {
      const res = await fetch('../data/cours.json');
      const data = await res.json();
      if (!Array.isArray(data) || data.length===0) {
        list.textContent = 'Aucun cours disponible.';
        return;
      }
      data.forEach(c=>{
        const a = document.createElement('a');
        a.className = 'list-group-item list-group-item-action';
        a.textContent = c.titre || ('Cours ' + (c.id||''));
        // lien vers le fichier si présent
        if (c.fichier) a.href = `../data/${c.fichier}`;
        list.appendChild(a);
      });
    } catch(e) {
      list.textContent = 'Erreur lors du chargement des cours.';
    }
  })();
  </script>
</main>
<footer class="bg-light py-3">
  <div class="container text-center">© 2026 Aide Prépa</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
